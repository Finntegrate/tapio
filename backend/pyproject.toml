[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tapio-backend"
version = "0.1.0"
description = "Tapio's RAG/agent-routing orchestration and its HTTP/SSE API, for the SvelteKit app"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    {name = "Finntegrate Team", email = "info@finntegrate.org"}
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "pydantic-settings>=2.6.0",
    "pydantic>=2.13.4",
    "langchain-chroma>=0.2.3",
    "langchain-huggingface[full]>=0.1.2",
    "ollama>=0.4.8",
]

[project.scripts]
tapio-backend = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "C90",   # mccabe complexity
    "D",     # pydocstyle
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle errors
    "EM",    # flake8-errmsg
    "EXE",   # flake8-executable
    "F",     # pyflakes
    "FA",    # flake8-future-annotations
    "FBT",   # flake8-boolean-trap
    "FIX",   # flake8-fixme
    "FLY",   # flynt
    "FURB",  # refurb
    "G",     # flake8-logging-format
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "TC",    # flake8-type-checking
    "TD",    # flake8-todos
    "TID",   # flake8-tidy-imports
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
    "YTT",   # flake8-2020
]
ignore = [
    "ANN401",  # Any is used intentionally for flexible metadata dicts
    "BLE001",  # broad except-and-log-and-continue is intentional throughout the RAG/LLM service layer
    "COM812",  # trailing-comma rules conflict with the ruff formatter
    "ISC001",  # implicit-str-concat conflicts with the ruff formatter
    "TC001",   # first-party imports behind TYPE_CHECKING breaks Pydantic/FastAPI's runtime introspection
    "TC002",   # same risk as TC001, for third-party imports
    "TC003",   # same risk as TC001, for standard-library imports
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN",     # tests are excluded from mypy and don't need type annotations
    "ARG001",  # unused fixture/mock arguments are normal in tests
    "ARG002",  # unused mock-override arguments are normal in tests
    "D",       # docstrings aren't required on test functions
    "INP001",  # tests intentionally use implicit namespace packages
    "PLC0415", # local imports for mocking/patching timing are idiomatic in tests
    "PLR0913", # test functions naturally take many fixture arguments
    "PLR0917", # mock-heavy test functions naturally have many positional arguments
    "PLR2004", # magic values in test assertions/fixtures are fine
    "PT009",   # some test classes intentionally use unittest.TestCase-style assertions
    "PTH",     # os.path-based temp file/dir handling in test fixtures is fine
    "S101",    # assert is the standard pytest idiom
    "SLF001",  # tests intentionally exercise private members
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=2.3.0",
    "prek>=0.2.3",
    "pyrefly>=1.1.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
