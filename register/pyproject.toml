[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tapio-register"
version = "0.1.0"
description = "Tapio's versioned term register: the closed-world authority guide answers are validated against"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    {name = "Finntegrate Team", email = "info@finntegrate.org"}
]
dependencies = [
    # Imported directly to validate against the checked-in JSON Schema, so it is
    # declared here rather than relied on as one of LinkML's transitive deps.
    "jsonschema>=4.23.0",
    "linkml>=1.9.4",
    "linkml-runtime>=1.9.7",
    "pydantic>=2.13.4",
    "pyshacl>=0.30.1",
    "rdflib>=7.1.4",
    "httpx>=0.27.0",
    "pyyaml>=6.0.3",
    "typer>=0.9.0",
]

[project.scripts]
tapio-register = "tapio_register.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["tapio_register"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "types-jsonschema>=4.23.0",
    "types-pyyaml>=6.0.12",
    "pyrefly>=1.1.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["tapio_register/generated/*"]

[tool.ruff]
line-length = 120
target-version = "py314"
# LinkML writes tapio_register/generated/; it is regenerated by
# `tapio-register generate` and checked in, so it is reviewed as a build
# artifact rather than linted as hand-written source.
extend-exclude = ["tapio_register/generated"]

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "C90",   # mccabe complexity
    "D",     # pydocstyle
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle errors
    "EM",    # flake8-errmsg
    "EXE",   # flake8-executable
    "F",     # pyflakes
    "FA",    # flake8-future-annotations
    "FBT",   # flake8-boolean-trap
    "FIX",   # flake8-fixme
    "FLY",   # flynt
    "FURB",  # refurb
    "G",     # flake8-logging-format
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "TC",    # flake8-type-checking
    "TD",    # flake8-todos
    "TID",   # flake8-tidy-imports
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
    "YTT",   # flake8-2020
]
ignore = [
    "ANN401",  # Any is used intentionally for flexible metadata dicts
    "BLE001",  # broad except-and-log-and-continue is intentional around network seeding
    "COM812",  # trailing-comma rules conflict with the ruff formatter
    "ISC001",  # implicit-str-concat conflicts with the ruff formatter
    "TC001",   # first-party imports behind TYPE_CHECKING breaks Pydantic runtime introspection
    "TC002",   # same risk as TC001, for third-party imports
    "TC003",   # same risk as TC001, for standard-library imports
]

[tool.ruff.lint.per-file-ignores]
"tapio_register/cli.py" = [
    "FBT001", # typer options are declared as boolean positional parameters
    "FBT002", # a flag's default is False, which is what makes it a flag
    "FBT003", # typer.Option(False, ...) is the standard boolean-flag idiom
]
# LinkML, pyshacl, and rdflib are slow to import and are only needed when the
# schema or shape pass actually runs, so these modules import them in-function
# and keep `tapio-register` (and any consumer that only loads the register)
# fast to start.
"tapio_register/generation.py" = ["PLC0415"]
"tapio_register/validation.py" = ["PLC0415"]
"tests/*" = [
    "ANN",     # tests are excluded from mypy and don't need type annotations
    "ARG001",  # unused fixture/mock arguments are normal in tests
    "ARG002",  # unused mock-override arguments are normal in tests
    "D",       # docstrings aren't required on test functions
    "INP001",  # tests intentionally use implicit namespace packages
    "PLC0415", # local imports for mocking/patching timing are idiomatic in tests
    "PLR0913", # test functions naturally take many fixture arguments
    "PLR0917", # mock-heavy test functions naturally have many positional arguments
    "PLR2004", # magic values in test assertions/fixtures are fine
    "PT009",   # some test classes intentionally use unittest.TestCase-style assertions
    "PT019",   # leading-underscore @patch-injected mock parameters aren't pytest fixtures
    "PTH",     # os.path-based temp file/dir handling in test fixtures is fine
    "S101",    # assert is the standard pytest idiom
    "SLF001",  # tests intentionally exercise private members
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
