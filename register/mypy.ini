[mypy]
python_version = 3.14
warn_redundant_casts = True
warn_unreachable = True
warn_unused_configs = True
pretty = True
mypy_path = .
allow_untyped_defs = False
# LinkML's generated Pydantic module is a build artifact, not hand-written source.
exclude = ^(tests/|tapio_register/generated/)

[mypy-linkml.*]
ignore_missing_imports = True

[mypy-linkml_runtime.*]
ignore_missing_imports = True

[mypy-pyshacl.*]
ignore_missing_imports = True

[mypy-tapio_register.generated.*]
ignore_errors = True
