  definition:
    en: A permit issued to a foreign national for a purpose other than tourism or a comparable short-term
      residence that entitles the holder to enter the country repeatedly and stay in the country. Residence
      permits are either fixed-term or permanent. A residence permit can be issued on the basis of, for
      example, work, self-employment, studies or family ties. See fixed-term residence permit, permanent
      residence permit. See also visa.
  close_match:
