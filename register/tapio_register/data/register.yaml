- id: step:asylum-interview
  kind: step
  pref_label:
    en: asylum interview
    fi: turvapaikkapuhuttelu
    sv: asylsamtal
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: The purpose of an asylum interview is to establish the grounds for an asylum application. The
      asylum interview is conducted by the Finnish Immigration Service.
  handled_by:
  - org:migri
- id: step:asylum-examination
  kind: step
  pref_label:
    en: asylum examination
    fi: turvapaikkatutkinta
    sv: asylutredning
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: A procedure in which the Finnish Immigration Service or the Border Guard first establishes the
      identity and travel route of the asylum seeker and whether his or her application can be processed
      in Finland. After that, the Finnish Immigration Service interviews the applicant in order to establish
      the grounds for his or her asylum application. See asylum interview.
  handled_by:
  - org:migri
- id: step:dublin-procedure
  kind: step
  pref_label:
    en: Dublin procedure
    fi: Dublin-menettely
    sv: Dublinförfarande
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: The Dublin procedure is based on the EU Dublin Regulation and is conducted to determine the state
      responsible for examining an asylum application. The member states of the EU as well as Iceland,
      Liechtenstein, Norway and Switzerland apply the Regulation. Another country can be responsible for
      examining an application if the asylum seeker, for example, has family ties, a residence permit
      or a visa in another country applying the Regulation. Another country is also responsible for examining
      an application if the asylum seeker’s fingerprints have been entered in the Eurodac system after
      an illegal crossing of the external border of the EU. The country where an asylum seeker has previously
      sought asylum may also be responsible for examining the application. See European Union (EU), asylum.
- id: step:consider-application-inadmissible
  kind: step
  pref_label:
    en: considering an application inadmissible
    fi: tutkimatta jättäminen
    sv: avvisande av ansökan utan prövning
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: Considering an application inadmissible means that the application is not examined in substance.
      However, the Finnish Immigration Service will always conduct a preliminary examination and decide
      whether your application contains grounds for continuing the examination. If there are such grounds,
      the application will be examined in substance. If there are no such grounds, you may get a decision
      on your application being dismissed as inadmissible.
- id: term:manifestly-unfounded-application
  kind: term
  pref_label:
    en: manifestly unfounded application
    fi: ilmeisen perusteeton hakemus
    sv: uppenbart ogrundad ansökan
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: An asylum application can be considered manifestly unfounded if 1) no serious violations of human
      rights or other grounds that are related to non-refoulement have been presented, or if the claims
      presented are clearly implausible, 2) the applicant obviously intends to abuse the asylum procedure
      or 3) the applicant comes from a safe country of origin where he or she may be returned. See also
      non-refoulement.
- id: step:tracing
  kind: step
  pref_label:
    en: tracing
    fi: jäljittäminen
    sv: spårande
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: Tracing means establishing the location of the parents or a guardian of an unaccompanied minor
      or of a child victim of human trafficking who applies for international protection.
- id: term:emergency-cases
  kind: term
  pref_label:
    en: emergency cases
    fi: hätätapaukset
    sv: akuta fall
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: Persons who the UN refugee agency UNHCR considers to be refugees in need of urgent resettlement,
      often due to their personal safety or health. These persons are admitted into the country on the
      basis of UNHCR’s documents without being interviewed by the Finnish authorities. The emergency cases
      that are admitted into Finland are a part of the yearly refugee quota. In recent years, the yearly
      number of emergency cases admitted into Finland has been 100. See also quota refugee.
  related:
  - status:quota-refugee
- id: step:assisted-voluntary-return
  kind: step
  pref_label:
    en: assisted voluntary return
    fi: avustettu vapaaehtoinen paluu
    sv: assisterad frivillig återresa
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: Assisted voluntary return refers to an arrangement where a third-country national who has applied
      for international protection, a beneficiary of temporary protection, a victim of human trafficking
      or a person who has been granted a residence permit under section 51 of the Aliens Act can receive
      assistance and compensation for travel and relocation costs to his or her home country or another
      country. A further requirement is that the applicant must leave the country voluntarily and with
      permanent intent after having cancelled his or her application or after the application has been
      rejected. See international protection, third-country national, temporary protection. Cf. voluntary
      return.
- id: step:voluntary-return
  kind: step
  pref_label:
    en: voluntary return
    fi: vapaaehtoinen paluu
    sv: frivillig återresa
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: In a decision on denial of admittance or stay or on deportation, which does not include an entry
      ban, a third-country national is given a period of at least seven and a maximum of thirty days during
      which he or she can leave the country voluntarily. See denial of admittance or stay, deportation,
      entry ban, third-country national. See also assisted voluntary return.
- id: term:non-refoulement
  kind: term
  pref_label:
    en: non-refoulement
    fi: palautuskielto (non-refoulement)
    sv: förbud mot tillbakasändning, förbud mot återsändande
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: According to the principle of non-refoulement, no one may be sent back to an area where he or
      she could be subject to the death penalty, torture, persecution or other inhuman treatment or other
      treatment violating human dignity.
- id: step:detention
  kind: step
  pref_label:
    en: detention
    fi: säilöönotto
    sv: tagande i förvar, förvarstagande
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: An interim measure, means of monitoring. A foreign national may be held in detention if there
      are grounds to believe that he or she will, for example, hide in order to avoid denial of admittance
      or stay or deportation. An asylum seeker may be held in detention if it is necessary to establish
      his or her identity.
- id: step:denial-of-admittance-or-stay
  kind: step
  pref_label:
    en: denial of admittance or stay
    fi: käännyttäminen
    sv: avvisning
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: Procedure for removing a person from the country. When a foreign national has not been issued
      with a residence permit and a decision is made to remove the person from the country, he or she
      is denied admittance or stay. Cf. deportation.
  handled_by:
  - org:migri
- id: step:deportation
  kind: step
  pref_label:
    en: deportation
    fi: karkottaminen
    sv: utvisning
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: Procedure for removing a person from the country. When a foreign national has been issued with
      a residence permit but a decision is made to remove the person from the country, he or she will
      be deported. Cf. refusal of entry.
  handled_by:
  - org:migri
- id: term:entry-ban
  kind: term
  pref_label:
    en: entry ban
    fi: maahantulokielto
    sv: inreseförbud
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: In a decision on denial of admittance or stay or on deportation, a foreign national may be prohibited
      from entering Finland. The entry ban may be valid for a fixed term or until further notice, and
      it applies either in the entire Schengen area or only in Finland. See also Schengen area.
  handled_by:
  - org:migri
- id: term:removal-from-the-country
  kind: term
  pref_label:
    en: Removal from the country
