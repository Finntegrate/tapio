    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: A person may be a citizen of two or several countries.
- id: term:finnish-origin
  kind: term
  pref_label:
    en: Finnish origin
    fi: suomalainen syntyperä
    sv: finländsk härkomst
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: Finnish origin refers to Finnish citizens, former Finnish citizens, descendants of persons who
      have acquired Finnish citizenship by birth and, in residence permit matters, also persons of Finnish
      ethnic origin. See also Finnish citizen, Finnish citizen by birth, citizenship, (ethnic) nationality,
      ethnic origin.
- id: status:returnee
  kind: status
  pref_label:
    en: returnee
    fi: paluumuuttaja
    sv: återflyttare
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: In residence permit matters, a returnee refers to a person moving to Finland who is of Finnish
      extraction or a person who otherwise has close ties to Finland (is a former Finnish citizen, a descendant
      of a person who is a Finnish citizen by birth or is otherwise Finnish in origin, for example an
      Ingrian Finn). See also Finnish citizen, Finnish citizen by birth, Finnish origin.
- id: status:sponsor
  kind: status
  pref_label:
    en: sponsor
    fi: perheenkokoaja
    sv: anknytningsperson
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: A person residing in Finland whose family member applies for a residence permit to Finland on
      the basis of family ties in order to be together with the sponsor.
  related:
  - permit:family-ties-residence-permit
- id: status:asylum-seeker
  kind: status
  pref_label:
    en: asylum seeker
    fi: turvapaikanhakija
    sv: asylsökande
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: A person who seeks protection and right of residence in a foreign state. An asylum seeker is granted
      refugee status if he or she is granted asylum. See asylum, refugee.
- id: status:refugee
  kind: status
  pref_label:
    en: refugee
    fi: pakolainen
    sv: flykting
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  - source: yso
    url: http://www.yso.fi/onto/yso/p6458
    observed_on: '2026-09-19'
    note: 'YSO: refugees / pakolaiset / flyktingar'
  definition:
    en: A foreign national who has a well-founded fear of being persecuted for reasons of ethnic origin,
      religion, nationality, membership in a particular social group or political opinion. Refugee status
      is granted to a person who has been granted asylum by a state or who is considered a refugee by
      UNHCR. See also quota refugee, asylum seeker, asylum.
  close_match:
  - yso:p6458
- id: status:refugee-sur-place
  kind: status
  pref_label:
    en: refugee sur place
    fi: sur place -pakolainen
    sv: flykting ”sur place”
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: A refugee whose need of protection has arisen after he or she has left his or her home country.
      See also refugee.
  broader:
  - status:refugee
- id: status:quota-refugee
  kind: status
  pref_label:
    en: quota refugee
    fi: kiintiöpakolainen
    sv: kvotflykting
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: A person considered a refugee by the UN refugee agency UNHCR who has been granted a residence
      permit under the refugee quota verified in the Finnish state budget. In recent years, the Finnish
      refugee quota has been 750–1,050 people. See also emergency cases, refugee.
  broader:
  - status:refugee
- id: status:international-protection
  kind: status
  pref_label:
    en: international protection
    fi: kansainvälinen suojelu
    sv: internationellt skydd According to EU directives and the Finnish Aliens Act, international protection
      means refugee status or subsidiary protection status. See also refugee, subsidiary protection, humanitarian
      protection.
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
- id: status:subsidiary-protection
  kind: status
  pref_label:
    en: subsidiary protection
    fi: toissijainen suojelu
    sv: alternativt skydd
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: Reason for granting a residence permit. A residence permit is issued on the basis of subsidiary
      protection when the requirements for granting asylum are not met, but the applicant faces a risk
      of being subjected to the death penalty, execution, torture or other inhuman or degrading treatment
      or punishment in his or her home country or country of former habitual residence. A permit may also
      be issued if the applicant is unable to return to his or her home country or country of former habitual
      residence without being exposed to serious and individual threat as a result of armed conflicts.
      See also asylum, international protection.
  broader:
  - status:international-protection
- id: status:temporary-protection
  kind: status
  pref_label:
    en: Temporary protection
    fi: Tilapäinen suojelu
    sv: Tillfälligt skydd
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/temporary-protection
    observed_on: '2026-09-19'
  - source: migri
    url: https://migri.fi/tilapainen-suojelu
    observed_on: '2026-09-19'
  - source: migri
    url: https://migri.fi/sv/tillfalligt-skydd
    observed_on: '2026-09-19'
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: Temporary protection may be given to foreign nationals who need international protection and who
      cannot return safely to their home country or country of permanent residence, because there has
      been a massive displacement of people in the country or its neighbouring areas as a result of an
      armed conflict, some other violent situation or an environmental disaster. Providing temporary protection
      requires that the need for protection may be considered to be of short duration.
- id: status:humanitarian-protection
  kind: status
  pref_label:
    en: humanitarian protection
    fi: humanitaarinen suojelu
    sv: humanitärt skydd
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: Reason for granting a residence permit until 16 May 2016. It was possible to grant a residence
      permit on the basis of humanitarian protection when the requirements for granting asylum or providing
      subsidiary protection were not met, but the applicant could not return to his or her home country
      or country of former habitual residence because of an environmental catastrophe. Another possible
      reason was a poor security situation which might have been due to an armed conflict or a poor human
      rights situation. See also asylum, subsidiary protection.
  valid_until: '2016-05-16'
  change_note: Ceased to be a ground for granting a residence permit on 16 May 2016; nothing replaced
    it directly. Applicants are assessed for asylum and subsidiary protection instead.
  related:
  - status:subsidiary-protection
- id: status:asylum
  kind: status
  pref_label:
    en: asylum
    fi: turvapaikka
    sv: asyl
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: A residence permit issued to a foreign national under the asylum procedure on the basis of his
      or her refugee status. See refugee.
- id: term:legal-residence
  kind: term
  pref_label:
    en: legal residence
    fi: laillinen oleskelu
    sv: laglig vistelse
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: Legal stay means that a foreign national is residing in the country with appropriate and valid
      permits. The stay is legal on the basis of a valid visa, exemption from the visa requirement or
      a valid residence permit. A foreign national may reside legally in the country also while his or
      her residence permit or asylum application is being processed.
- id: term:registered-partnership
  kind: term
  pref_label:
    en: registered partnership
    fi: rekisteröity parisuhde
    sv: registrerat partnerskap
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: An official relationship between two persons of the same sex. A registered partnership is in many
      ways comparable to a marriage.
- id: term:ethnic-nationality
  kind: term
  pref_label:
    en: ethnic nationality
    fi: kansallisuus
    sv: nationalitet
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: Ethnic background. Belonging to a specific nation or a group of people (e.g. Ingrian Finns, Kurds,
      Roma). Ethnic nationality has a different meaning than citizenship. For instance, a person of Kurdish
      ethnic origin may hold Finnish citizenship. Cf. citizenship.
