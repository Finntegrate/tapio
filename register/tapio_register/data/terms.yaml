- id: term:schengen-area
  kind: term
  pref_label:
    en: Schengen area
    fi: Schengen-alue
    sv: Schengenområdet
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: The Schengen area refers to the area of states applying the Schengen acquis. These states include
      Austria, Belgium, Bulgaria, Czechia, Croatia, Denmark, Estonia, Finland, France, Germany, Greece,
      Hungary, Iceland, Italy, Latvia, Liechtenstein, Lithuania, Luxembourg, Malta, the Netherlands, Norway,
      Poland, Portugal, Romania, Slovakia, Slovenia, Spain, Sweden and Switzerland.
- id: term:finnish-origin
  kind: term
  pref_label:
    en: Finnish origin
    fi: suomalainen syntyperä
    sv: finländsk härkomst
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: Finnish origin refers to Finnish citizens, former Finnish citizens, descendants of persons who
      have acquired Finnish citizenship by birth and, in residence permit matters, also persons of Finnish
      ethnic origin. See also Finnish citizen, Finnish citizen by birth, citizenship, (ethnic) nationality,
      ethnic origin.
- id: term:legal-residence
  kind: term
  pref_label:
    en: legal residence
    fi: laillinen oleskelu
    sv: laglig vistelse
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: Legal stay means that a foreign national is residing in the country with appropriate and valid
      permits. The stay is legal on the basis of a valid visa, exemption from the visa requirement or
      a valid residence permit. A foreign national may reside legally in the country also while his or
      her residence permit or asylum application is being processed.
- id: term:registered-partnership
  kind: term
  pref_label:
    en: registered partnership
    fi: rekisteröity parisuhde
    sv: registrerat partnerskap
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: An official relationship between two persons of the same sex. A registered partnership is in many
      ways comparable to a marriage.
- id: term:ethnic-nationality
  kind: term
  pref_label:
    en: ethnic nationality
    fi: kansallisuus
    sv: nationalitet
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: Ethnic background. Belonging to a specific nation or a group of people (e.g. Ingrian Finns, Kurds,
      Roma). Ethnic nationality has a different meaning than citizenship. For instance, a person of Kurdish
      ethnic origin may hold Finnish citizenship. Cf. citizenship.
- id: term:country-of-nationality
  kind: term
  pref_label:
    en: country of nationality
    fi: kansalaisuusvaltio
    sv: medborgarskapsland
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: The country of which a person holds citizenship. See citizenship.
- id: term:citizenship
  kind: term
  pref_label:
    en: citizenship
    fi: kansalaisuus
    sv: medborgarskap
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  - source: yso
    url: http://www.yso.fi/onto/yso/p2736
    observed_on: '2026-09-19'
    note: 'YSO: citizenship / kansalaisuus / medborgarskap'
  definition:
    en: Citizenship means a legislative bond between an individual and a state determining the individual’s
      status in the state as well as the basic rights and duties existing between the individual and the
      state.
  related:
  - law:citizenship-act
  exact_match:
  - yso:p2736
