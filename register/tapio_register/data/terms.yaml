- id: term:european-union
  kind: term
  pref_label:
    en: European Union
    fi: Euroopan unioni (EU)
    sv: Europeiska unionen (EU)
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: 'The European Union is a political and economic union that has 27 European member states: Austria,
      Belgium, Bulgaria, Croatia, Cyprus, Czechia, Denmark, Estonia, Finland, France, Germany, Greece,
      Hungary, Ireland, Italy, Latvia, Lithuania, Luxembourg, Malta, the Netherlands, Poland, Portugal,
      Romania, Slovakia, Slovenia, Spain and Sweden.'
- id: term:european-economic-area
  kind: term
  pref_label:
    en: European Economic Area
    fi: Euroopan talousalue (ETA)
    sv: Europeiska ekonomiska samarbetsområdet (EES)
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: The European Economic Area is a common market. Member states of the European Union as well as
      Iceland, Liechtenstein and Norway belong to the European Economic Area. See European Union (EU).
- id: term:birthplace-principle
  kind: term
  pref_label:
    en: birthplace principle
    fi: syntymämaaperiaate
    sv: territorialprincipen, födelselandsprincipen
  valid_from: '2003-06-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: A principle according to which a child acquires citizenship on the basis of the place of birth
      (ius soli). The birthplace principle is a secondary principle in the Finnish Citizenship Act. Cf.
      parentage principle, inheritance principle.
- id: term:parentage-principle
  kind: term
  pref_label:
    en: parentage principle
    fi: periytymisperiaate
    sv: härstamningsprincipen
  valid_from: '2003-06-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: A principle according to which a child acquires the citizenship of his or her parent (ius sanguinis).
      The inheritance principle is a primary principle in the Finnish Citizenship Act. Cf. birthplace
      principle.
