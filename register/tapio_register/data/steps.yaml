- id: step:citizenship-application
  kind: step
  pref_label:
    en: Citizenship application
    fi: Kansalaisuushakemus aikuiselle
    sv: Medborgarskapsansökan för vuxna
  valid_from: '2003-06-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/citizenship-for-adults
    observed_on: '2026-09-19'
  - source: migri
    url: https://migri.fi/kansalaisuus-aikuiselle
    observed_on: '2026-09-19'
  - source: migri
    url: https://migri.fi/sv/medborgarskap-for-vuxna
    observed_on: '2026-09-19'
  handled_by:
  - org:migri
  definition:
    en: A foreign national may be granted Finnish citizenship on application if the requirements laid
      down in the Citizenship Act are met. Exceptions may be made as provided in the Act. Cf. citizenship
      declaration.
