- id: step:apply-for-asylum
  kind: step
  pref_label:
    en: Applying for asylum
    fi: Turvapaikka Suomesta
    sv: Asyl i Finland
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/asylum-in-finland
    observed_on: '2026-09-19'
    note: States that an application is made in person to the border authorities or the police, and processed
      by the Finnish Immigration Service.
  - source: migri
    url: https://migri.fi/turvapaikka-suomesta
    observed_on: '2026-09-19'
  - source: migri
