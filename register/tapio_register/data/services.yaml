- id: svc:reception-centre
  kind: service
  pref_label:
    en: reception centre
    fi: vastaanottokeskus
    sv: förläggning
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: A facility where persons applying for international protection and beneficiaries of temporary
      protection are accommodated and that provides the reception services for them. Group homes and supported
      housing units intended for children are reception centres, too. See also international protection,
      temporary protection.
  handled_by:
  - org:migri
- id: svc:reception-unit
  kind: service
  pref_label:
    en: reception unit
    fi: vastaanottoyksikkö
    sv: mottagningsenhet
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: Reception unit is a generic concept that covers all premises where asylum seekers are accommodated.
      A reception unit can refer to, for example, reception centres and temporary accommodation units.
      See also reception centre.
  handled_by:
  - org:migri
- id: svc:registration-centre
  kind: service
  pref_label:
    en: registration centre
    fi: järjestelykeskus
    sv: flyktingsluss
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: A registration centre is a unit for the reception and registration of newly arrived asylum seekers.
      After being registered, the asylum seekers move to reception centres. See also reception centre.
  handled_by:
  - org:migri
