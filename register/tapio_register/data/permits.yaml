  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: A residence permit that is valid for a certain time period. Fixed-term residence permits are issued
      for a continuous or temporary residence. See continuous residence permit, temporary residence permit.
      Cf. permanent residence permit.
  broader:
  - permit:residence-permit
