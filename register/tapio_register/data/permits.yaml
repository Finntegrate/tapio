- id: permit:p-eu-residence-permit
  kind: permit
  pref_label:
    en: P-EU permit
    fi: P-EU-oleskelulupa
    sv: P-EU-uppehållstillstånd
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/p-eu-residence-permit
    observed_on: '2026-09-19'
  - source: migri
    url: https://migri.fi/p-eu-oleskelulupa
    observed_on: '2026-09-19'
  - source: migri
    url: https://migri.fi/sv/p-eu-uppehallstillstand
    observed_on: '2026-09-19'
  broader:
  - permit:residence-permit
  handled_by:
  - org:migri
  alt_labels:
    en:
    - long-term resident's EU residence permit
    - EU residence permit
  definition:
    en: A long-term resident’s EU residence permit that can be issued to a third-country national after
      he or she has resided within the territory of the European Union for a continuous period of five
      years. The permit is valid until further notice. An EU residence permit bears the letters P-EU.
      See third-country national.
- id: permit:continuous-residence-permit
  kind: permit
  pref_label:
    en: continuous residence permit
    fi: jatkuva oleskelulupa
    sv: kontinuerligt uppehållstillstånd
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: A fixed-term residence permit. The permit is issued to a foreign national who has arrived in Finland
      with the intention of permanent immigration. The permit must be renewed before the permit expires.
      A continuous residence permit bears the letter A. Cf. temporary residence permit.
  broader:
  - permit:residence-permit
  notation: A
- id: permit:temporary-residence-permit
  kind: permit
  pref_label:
    en: temporary residence permit
    fi: tilapäinen oleskelulupa
    sv: tillfälligt uppehållstillstånd
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  definition:
    en: A fixed-term residence permit. The permit is issued to a foreign national who does not intend
      to stay in Finland permanently. The permit must be renewed before it expires. A temporary residence
      permit bears the letter B. Cf. continuous residence permit.
  broader:
  - permit:residence-permit
  notation: B
- id: permit:fixed-term-residence-permit
  kind: permit
  pref_label:
    en: fixed-term residence permit
    fi: määräaikainen oleskelulupa
    sv: tidsbegränsat uppehållstillstånd
