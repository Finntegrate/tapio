# Permit concepts. Reviewed by hand against the sources
# named in each concept's observations. See ../README.md.
concepts:
- id: permit:residence-permit
  kind: permit
  pref_label:
    en: Residence permit
    fi: Oleskelulupa
    sv: Uppehållstillstånd
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/residence-permit
    observed_on: '2026-09-19'
  - source: migri
    url: https://migri.fi/oleskelulupa
    observed_on: '2026-09-19'
  - source: migri
    url: https://migri.fi/sv/uppehallstillstand
    observed_on: '2026-09-19'
  - source: migri
    url: https://migri.fi/en/glossary
    observed_on: '2026-09-19'
  - source: yso
    url: http://www.yso.fi/onto/yso/p6463
    observed_on: '2026-09-19'
    note: 'YSO: residence permits / oleskeluluvat / uppehållstillstånd'
  handled_by:
  - org:migri
  related:
  - law:aliens-act
  definition:
    en: A permit issued to a foreign national for a purpose other than tourism or a comparable short-term
      residence that entitles the holder to enter the country repeatedly and stay in the country. Residence
      permits are either fixed-term or permanent. A residence permit can be issued on the basis of, for
      example, work, self-employment, studies or family ties. See fixed-term residence permit, permanent
      residence permit. See also visa.
  close_match:
  - yso:p6463
