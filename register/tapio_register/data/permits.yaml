- id: permit:residence-card
  kind: permit
  pref_label:
    en: Residence card of a family member of an EU citizen
    fi: Perheenjäsenen oleskelukortti
    sv: Uppehållskort för familjemedlem
  valid_from: '2004-05-01'
  in_scope_of:
  - ilmarinen
  observations:
  - source: migri
    url: https://migri.fi/en/residence-card-for-family-members
    observed_on: '2026-09-19'
  - source: migri
    url: https://migri.fi/perheenjasenen-oleskelukortti
    observed_on: '2026-09-19'
  - source: migri
    url: https://migri.fi/sv/uppehallskort-for-familjemedlem
    observed_on: '2026-09-19'
  handled_by:
  - org:migri
  definition:
    en: A card issued by the Finnish Immigration Service, with which non-EU citizens who are family members
      of EU citizens can prove their right of residence in Finland. Biometric identifiers stored on the
      card’s chip include a facial image and two fingerprints. The residence card is not an official identity
      document. Cf. residence permit card. See EU citizen.
