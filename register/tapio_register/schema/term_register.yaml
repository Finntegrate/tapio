id: https://tapio.finntegrate.org/schema/term-register
name: tapio-term-register
title: Tapio term register
description: >-
  The schema for Tapio's versioned term register: the closed-world authority over
  which entities a guide answer may assert, and a time-indexed record of how the
  Finnish immigration and integration system changes.

  This file is the single source of truth. The Pydantic classes, JSON Schema, and
  SHACL shapes under ``tapio_register/generated/`` are all derived from it by
  ``tapio-register generate`` and are never edited by hand.
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  tapio: https://tapio.finntegrate.org/schema/
  skos: http://www.w3.org/2004/02/skos/core#
  dcterms: http://purl.org/dc/terms/
  # `sdo:` rather than `schema:`: LinkML's own context already binds `schema:`
  # to the http:// form of schema.org, and rebinding it logs an override on
  # every generator run.
  sdo: https://schema.org/
  org: https://tapio.finntegrate.org/register/organization/
  permit: https://tapio.finntegrate.org/register/permit/
  step: https://tapio.finntegrate.org/register/step/
  doc: https://tapio.finntegrate.org/register/document/
  status: https://tapio.finntegrate.org/register/status/
  svc: https://tapio.finntegrate.org/register/service/
  law: https://tapio.finntegrate.org/register/legal-act/
  term: https://tapio.finntegrate.org/register/term/

default_prefix: tapio
default_range: string

imports:
  - linkml:types

classes:
  TermRegister:
    tree_root: true
    description: >-
      One dated, immutable edition of the register. Concepts are never removed
      between editions: an entity that leaves force gains a ``valid_until`` and a
      ``superseded_by`` pointer instead (ADR 0007, decision 5).
    attributes:
      register_version:
        description: >-
          The release date of this edition, used verbatim as the
          ``register_version`` field of a provenance record. Dated and immutable,
          never a rolling identifier such as "main".
        range: date
        required: true
      title:
        description: Human-readable name of this edition.
        required: true
      description:
        description: What this edition covers, in one paragraph.
        required: true
      license:
        description: SPDX-style identifier or URL of the licence the edition is released under.
        required: true
      coverage_caveat:
        description: >-
          The statement of what the register does and does not record, published
          with every edition. The register records what its sources said on the
          dates they were observed, not ground truth; a gap in it is evidence of
          a gap in Tapio's attention, not evidence that nothing happened.
        required: true
      concepts:
        range: Concept
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1

  Concept:
    class_uri: skos:Concept
    description: >-
      One entity a guide answer may refer to: an authority, a permit, a step in a
      process, a document, a legal status, a service, a legal act, or a term of
      art. Closed world - an entity absent from the register cannot be asserted.
    attributes:
      id:
        description: >-
          Stable IRI, written as a CURIE whose prefix matches ``kind``
          (``org:`` for an organization, ``permit:`` for a permit, and so on).
        identifier: true
        range: uriorcurie
      kind:
        description: What sort of entity this is. Determines the IRI prefix and the RDF type.
        range: ConceptKind
        required: true
      pref_label:
        description: The one preferred label per language. Every concept carries all three.
        range: PrefLabels
        slot_uri: skos:prefLabel
        required: true
      alt_labels:
        description: >-
          Other surface forms the same entity is published under, including
          abbreviations and superseded names. Read by the ``ground`` node, so a
          user typing either form resolves to the same IRI.
        range: AltLabels
        slot_uri: skos:altLabel
      definition:
        description: A short gloss, in whichever languages have been reviewed.
        range: Definitions
        slot_uri: skos:definition
      notation:
        description: The code this entity carries in an official code list, where it has one.
        slot_uri: skos:notation
      valid_from:
        description: >-
          The earliest date from which the register is prepared to treat this
          entity as in force. Where a source names a commencement date, that date
          is used; otherwise it is the register's floor date, which records that
          the register has no evidence of a start date and asserts nothing
          earlier. Required from day one: it is what lets gate G5 check a
          historical claim against the state of affairs at its own reference date
          rather than against today.
        range: date
        slot_uri: sdo:validFrom
        required: true
      valid_until:
        description: >-
          The last date on which this entity was in force, inclusive, and absent
          while it still is. A body dissolved on 1 January 2025 therefore carries
          2024-12-31, and its successor's ``valid_from`` is 2025-01-01, so the
          two intervals meet without a gap or an overlap. A present-tense claim
          naming a concept whose ``valid_until`` has passed fails G5.
        range: date
        slot_uri: sdo:validThrough
      superseded_by:
        description: >-
          What took this entity's place. Populated whenever ``valid_until`` is
          set, and what lets G5 auto-repair a stale assertion without a second
          model call.
        range: uriorcurie
        slot_uri: dcterms:isReplacedBy
        multivalued: true
      change_note:
        description: What changed, in one sentence, when this entity was superseded or re-scoped.
        slot_uri: skos:changeNote
      broader:
        description: The more general concept this one falls under.
        range: uriorcurie
        slot_uri: skos:broader
        multivalued: true
      related:
        description: An associative link that is not subsumption.
        range: uriorcurie
        slot_uri: skos:related
        multivalued: true
      handled_by:
        description: >-
          The authority responsible for this permit, step, or service. Time-sliced
          by the validity of both ends, which is what makes "who was responsible
          in year N" answerable.
        range: uriorcurie
        slot_uri: tapio:handledBy
        multivalued: true
      exact_match:
        description: An external concept this one is equivalent to, in YSO, JUPO, PTV, or another published vocabulary.
        range: uriorcurie
        slot_uri: skos:exactMatch
        multivalued: true
      close_match:
        description: >-
          An external concept close enough to be useful but not equivalent. Used
          where YSO carries the general term and the register carries the
          Finnish administrative specific.
        range: uriorcurie
        slot_uri: skos:closeMatch
        multivalued: true
      in_scope_of:
        description: >-
          The guides whose remit this concept falls within. A guide's scope is the
          set of concepts naming it here, which is what gate G3 checks instead of
          a hand-written English sentence.
        range: GuideId
        multivalued: true
        required: true
        # `required` alone permits an empty list; this is what makes it one or more.
        minimum_cardinality: 1
      observations:
        description: >-
          Where this entity was seen, and when. At least one per concept: the
          register records what a named source said on a given date, and this is
          what lets a reader judge its coverage rather than take it on faith.
        range: Observation
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1

  PrefLabels:
    description: The preferred label in each of the three languages the corpus is grounded in.
    attributes:
      en: {description: English preferred label., required: true}
      fi: {description: Finnish preferred label., required: true}
      sv: {description: Swedish preferred label., required: true}

  AltLabels:
    description: Additional surface forms, per language.
    attributes:
      en: {description: English alternative labels., multivalued: true}
      fi: {description: Finnish alternative labels., multivalued: true}
      sv: {description: Swedish alternative labels., multivalued: true}

  Definitions:
    description: A short gloss, per language. Languages are filled in as they are reviewed.
    attributes:
      en: {description: English definition.}
      fi: {description: Finnish definition.}
      sv: {description: Swedish definition.}

  Observation:
    description: One record of a source stating something about a concept, on a date.
    attributes:
      source:
        description: The publisher the observation came from.
        range: SourceId
        required: true
      url:
        description: The exact page or API response observed, not a site root.
        range: uri
        slot_uri: dcterms:source
        required: true
      observed_on:
        description: >-
          When Tapio looked, which is not when reality changed. The distinction
          matters when reading the register as a record of administrative change.
        range: date
        slot_uri: dcterms:date
        required: true
      note:
        description: What this source contributed, where that is not obvious.

enums:
  ConceptKind:
    description: The sort of entity a concept denotes, and the IRI prefix it takes.
    permissible_values:
      organization:
        description: A body that decides, handles, or advises. Valid target of an answer plan's ``authority``.
      permit:
        description: A residence permit, visa, card, or registration of a right of residence.
      step:
        description: A step a person takes, or that is taken on their application. Valid target of a ``next_step``.
      document:
        description: Something a person supplies, receives, or holds.
      status:
        description: A legal status or category a person falls into.
      service:
        description: A named channel or system through which business is transacted.
      legal_act:
        description: An act, decree, or EU instrument.
      term:
        description: A term of art with no better home among the other kinds.

  GuideId:
    description: The guides in the network, per ADR 0005.
    permissible_values:
      tapio: {description: Orchestrator.}
      ilmarinen: {description: Immigration documents and forms.}
      sampo: {description: Financial requirements and costs.}
      rauni: {description: Work permits and employment.}
      otso: {description: Settlement and daily life.}

  SourceId:
    description: >-
      The publishers the register is seeded from, per the ontological harness
      specification section 10.
    permissible_values:
      yso: {description: "YSO general Finnish ontology, via the Finto API."}
      jupo: {description: "JUPO, the Finnish ontology for public administration services, via the Finto API."}
      suomi_fi_terminologies: {description: "Finnish public sector terminologies, sanastot.suomi.fi."}
      koodistot: {description: "Official code lists, koodistot.suomi.fi."}
      ptv: {description: "Suomi.fi Service Catalogue open API."}
      suomi_fi: {description: "Suomi.fi guidance pages."}
      migri: {description: "Finnish Immigration Service, migri.fi."}
      enter_finland: {description: "Enter Finland, Migri's e-service."}
      finlex: {description: "Finlex, the national legislative database."}
      infofinland: {description: "InfoFinland."}
      dvv: {description: "Digital and Population Data Services Agency."}
      kela: {description: "Kela, the Social Insurance Institution."}
      police: {description: "Finnish Police."}
      tyomarkkinatori: {description: "Job Market Finland."}
      corpus: {description: "A term mined from Tapio's own crawled corpus and reviewed by hand."}
      other: {description: "A source with no dedicated entry, named in the observation note."}
