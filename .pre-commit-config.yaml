default_language_version:
  python: python3.14
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
        # tsconfig.json/jsconfig.json are JSONC (comments, trailing commas
        # allowed) per the TypeScript spec, not strict JSON.
        exclude: (^|/)(tsconfig|jsconfig)\.json$
      - id: check-toml
      - id: check-merge-conflict
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py313-plus]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.1
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/google/keep-sorted
    rev: v0.6.0
    hooks:
      - id: keep-sorted
  - repo: local
    hooks:
      - id: mypy-crawler
        name: Mypy crawler
        entry: uv run --directory crawler mypy --config-file mypy.ini tapio_crawler
        language: system
        files: ^crawler/(?:.*\.py|mypy\.ini|pyrefly\.toml|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: pyrefly-crawler
        name: Pyrefly crawler
        entry: uv run --directory crawler pyrefly check
        language: system
        files: ^crawler/(?:.*\.py|mypy\.ini|pyrefly\.toml|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: mypy-ingest
        name: Mypy ingest
        entry: uv run --directory ingest mypy tapio_ingest
        language: system
        files: ^ingest/(?:.*\.py|mypy\.ini|pyrefly\.toml|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: pyrefly-ingest
        name: Pyrefly ingest
        entry: uv run --directory ingest pyrefly check
        language: system
        files: ^ingest/(?:.*\.py|mypy\.ini|pyrefly\.toml|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: mypy-backend
        name: Mypy backend
        entry: uv run --directory backend mypy --config-file mypy.ini app
        language: system
        files: ^backend/(?:.*\.py|mypy\.ini|pyrefly\.toml|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: pyrefly-backend
        name: Pyrefly backend
        entry: uv run --directory backend pyrefly check
        language: system
        files: ^backend/(?:.*\.py|mypy\.ini|pyrefly\.toml|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      # actionlint and markdownlint-cli2 are installed via mise (see mise.toml)
      # rather than as pre-commit-managed hook repos, since both already exist as
      # mise tools used elsewhere in the project. Routed through `mise exec --`
      # rather than calling the binary directly: git invokes hooks without
      # sourcing the shell's `mise activate`, so mise's shims aren't guaranteed
      # to be on PATH there even though they are in an interactive shell.
      # actionlint only understands workflow files (it requires "on"/"jobs"
      # sections), not composite action.yaml definitions under .github/actions/.
      - id: actionlint
        name: Lint GitHub Actions workflows
        entry: mise exec -- actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      # --fix covers structural rules (blanks-around-lists/fences, list markers,
      # trailing spaces, etc.). MD013 (line length/prose wrap) has no fixer in
      # markdownlint itself -- confirmed by testing --fix against a copy of
      # README.md, which left every MD013 violation unchanged -- so it stays
      # disabled in .markdownlint-cli2.jsonc rather than left as unfixable noise.
      - id: markdownlint-cli2
        name: Lint Markdown
        entry: mise exec -- markdownlint-cli2
        language: system
        types: [markdown]
        args: [--fix]
      # Requires app/node_modules (`npm ci --prefix app`); node comes from mise.
      - id: prettier-app
        name: Check formatting of SvelteKit app (Prettier)
        entry: bash -c 'cd app && npx --no-install prettier --check .'
        language: system
        files: ^app/
        pass_filenames: false
      - id: eslint-app
        name: Lint SvelteKit app (ESLint)
        entry: bash -c 'cd app && npx --no-install eslint .'
        language: system
        files: ^app/.*\.(js|cjs|mjs|ts|cts|mts|svelte)$
        pass_filenames: false
