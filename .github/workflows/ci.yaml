name: Service CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: crawler
            package: tapio_crawler
            mypy_args: --config-file mypy.ini tapio_crawler
          - service: ingest
            package: tapio_ingest
            mypy_args: tapio_ingest
          - service: backend
            package: app
            mypy_args: --config-file mypy.ini app
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.service }}/uv.lock
          version: "0.11.16"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --no-build --no-install-project

      - name: Lint
        run: uv run --no-sync --no-build ruff check .

      - name: Type check
        run: uv run --no-sync --no-build mypy ${{ matrix.mypy_args }}

      - name: Pyrefly type check
        run: uv run --no-sync --no-build pyrefly check

      - name: Test
        run: uv run --no-sync --no-build pytest -q --cov=${{ matrix.package }} --cov-fail-under=80

  app:
    name: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
