[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tapio-ingest"
version = "2.0.0"
description = "Tapio's independently deployable document-ingestion service"
requires-python = ">=3.14"
dependencies = [
    "langchain-chroma>=0.2.3",
    "langchain-huggingface[full]>=0.1.2",
    "langchain-text-splitters>=0.3.8",
    "python-frontmatter>=1.1.0",
    "typer>=0.9.0",
]

[project.scripts]
tapio-ingest = "tapio_ingest.cli:app"

[dependency-groups]
dev = ["pytest>=9.0.0", "pytest-asyncio>=1.0.0", "ruff>=0.16.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: test that exercises vector-store integration"]
