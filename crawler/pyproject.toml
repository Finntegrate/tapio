[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tapio-crawler"
version = "2.0.0"
description = "Tapio's independently deployable content-collection service"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "html2text>=2020.1.16",
    "httpx>=0.28.1",
    "lxml>=4.9.3",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.1",
    "python-frontmatter>=1.1.0",
    "typer>=0.9.0",
]

[project.scripts]
tapio-crawler = "tapio_crawler.cli:app"

[dependency-groups]
dev = ["pytest>=9.0.0", "pytest-asyncio>=1.0.0", "ruff>=0.16.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: test that exercises multiple crawler components"]

[tool.ruff.lint]
ignore = ["BLE001"]
