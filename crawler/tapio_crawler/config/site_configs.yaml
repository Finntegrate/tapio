# Default configuration for Crawl4AI source collection.
#
# See docs/specs/crawler-improvements.md for the discovery/scope/politeness
# schema.
sites:
  migri:
    base_url: "https://migri.fi"
    description: "Finnish Immigration Service website"
    crawler_config:
      max_depth: 1
      max_pages: 50
      recrawl_interval_hours: 720
      # migri.fi's robots.txt declares a 5s Crawl-delay; this is the floor
      # under which the shared rate limiter will never schedule a request.
      min_delay: 5.0
      max_delay: 8.0
      max_concurrent: 2
      remove_consent_popups: true
      remove_overlay_elements: true
      robots_policy: require
      politeness:
        respect_crawl_delay: true
      discovery:
        source: sitemap
        sitemap_urls: []
      scope:
        allowed_domains: ["migri.fi", "www.migri.fi"]
        languages: ["en"]
        include_url_patterns: ["/en/*"]
        exclude_url_patterns:
          - "*/search*"
          - "*/login*"
          - "*/asiointi*"
          - "*?*utm_*"
        allowed_content_types: ["text/html"]

  # Example configuration for TE Services website
  tyomarkkinatori:
    base_url: "https://tyomarkkinatori.fi/"
    description: "Work assistance and employment services website"
    crawler_config:
      max_depth: 1
      max_pages: 50
      recrawl_interval_hours: 720
      min_delay: 1.5
      max_delay: 3.0
      max_concurrent: 3
      remove_consent_popups: true
      remove_overlay_elements: true
      robots_policy: require
      politeness:
        respect_crawl_delay: true
      discovery:
        # No Sitemap: entry in robots.txt and /sitemap.xml returns 404.
        # Bounded deep crawl is the only discovery path for this source.
        source: none
      scope:
        allowed_domains: ["tyomarkkinatori.fi"]
        languages: ["en"]
        include_url_patterns: ["/en/*"]
        exclude_url_patterns:
          - "*/search*"
          - "*/login*"
          - "*?*utm_*"
        allowed_content_types: ["text/html"]
      gap_crawl:
        enabled: true
        seed_urls: ["https://tyomarkkinatori.fi/en"]
        strategy: bfs
        max_depth: 4
        max_pages: 300

  # Example configuration for Kela website
  kela:
    base_url: "https://www.kela.fi"
    description: "Kela (Social Insurance Institution of Finland) website"
    crawler_config:
      max_depth: 1
      max_pages: 50
      recrawl_interval_hours: 720
      min_delay: 1.2
      max_delay: 3.0
      max_concurrent: 4
      css_selector: "#content-root"
      robots_policy: require
      politeness:
        respect_crawl_delay: true
      discovery:
        source: sitemap
        sitemap_urls: []
      scope:
        allowed_domains: ["kela.fi", "www.kela.fi"]
        languages: ["en"]
        include_url_patterns: ["/en/*"]
        exclude_url_patterns:
          - "*/search*"
          - "*/login*"
          - "*?*utm_*"
        allowed_content_types: ["text/html"]

  # Example configuration for Vero website
  vero:
    base_url: "https://www.vero.fi/en/"
    description: "Vero (Guidance about taxation in Finland) website"
    crawler_config:
      max_depth: 1
      max_pages: 50
      recrawl_interval_hours: 720
      min_delay: 1.0
      max_delay: 3.0
      max_concurrent: 4
      remove_consent_popups: true
      remove_overlay_elements: true
      robots_policy: require
      politeness:
        respect_crawl_delay: true
      discovery:
        source: sitemap
        sitemap_urls: []
      scope:
        allowed_domains: ["vero.fi", "www.vero.fi"]
        languages: ["en"]
        include_url_patterns: ["/en/*"]
        exclude_url_patterns:
          - "*/search*"
          - "*/login*"
          - "*?*utm_*"
        allowed_content_types: ["text/html"]

  # Example configuration for DVV website
  dvv:
    base_url: "https://dvv.fi/"
    description: "DVV (Digital and population data services agency) website"
    crawler_config:
      max_depth: 1
      max_pages: 50
      recrawl_interval_hours: 720
      # dvv.fi's robots.txt declares a 5s Crawl-delay; see migri above.
      min_delay: 5.0
      max_delay: 8.0
      max_concurrent: 2
      remove_consent_popups: true
      remove_overlay_elements: true
      robots_policy: require
      politeness:
        respect_crawl_delay: true
      discovery:
        source: sitemap
        sitemap_urls: []
      scope:
        allowed_domains: ["dvv.fi", "www.dvv.fi"]
        languages: ["en"]
        include_url_patterns: ["/en/*"]
        exclude_url_patterns:
          - "*/search*"
          - "*/login*"
          - "*?*utm_*"
        allowed_content_types: ["text/html"]
