# Default configuration for Crawl4AI source collection.
sites:
  migri:
    base_url: "https://migri.fi"
    description: "Finnish Immigration Service website"
    crawler_config:
      max_depth: 1
      max_pages: 50
      min_delay: 1.0
      max_delay: 3.0
      max_concurrent: 3
      remove_consent_popups: true
      remove_overlay_elements: true

  # Example configuration for TE Services website
  tyomarkkinatori:
    base_url: "https://tyomarkkinatori.fi/"
    description: "Work assistance and employment services website"
    crawler_config:
      max_depth: 1
      max_pages: 50
      min_delay: 1.5
      max_delay: 3.0
      max_concurrent: 3
      remove_consent_popups: true
      remove_overlay_elements: true

  # Example configuration for Kela website
  kela:
    base_url: "https://www.kela.fi"
    description: "Kela (Social Insurance Institution of Finland) website"
    crawler_config:
      max_depth: 1
      max_pages: 50
      min_delay: 1.2
      max_delay: 3.0
      max_concurrent: 4
      css_selector: "#content-root"

  # Example configuration for Vero website
  vero:
    base_url: "https://www.vero.fi/en/"
    description: "Vero (Guidance about taxation in Finland) website"
    crawler_config:
      max_depth: 1
      max_pages: 50
      min_delay: 1.0
      max_delay: 3.0
      max_concurrent: 4
      remove_consent_popups: true
      remove_overlay_elements: true

  # Example configuration for DVV website
  dvv:
    base_url: "https://dvv.fi/"
    description: "DVV (Digital and population data services agency) website"
    crawler_config:
      max_depth: 1
      max_pages: 50
      min_delay: 1.0
      max_delay: 3.0
      max_concurrent: 4
      remove_consent_popups: true
      remove_overlay_elements: true
