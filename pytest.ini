[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
norecursedirs = tapio-evaluation
filterwarnings =
    ignore::DeprecationWarning:websockets.legacy:
    ignore::DeprecationWarning:.*:
    ignore::DeprecationWarning:gradio.utils:

markers =
    integration: Integration tests that use real components (slower, may download models)
    deepeval: Evaluation tests using DeepEval (requires Ollama and ChromaDB)
