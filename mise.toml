[tools]
actionlint = "1.7.12"
claude-code = "latest"
dasel = "latest"
gh = "latest"
jq = "latest"
markdownlint-cli2 = "0.22.1"
node = "24"
ollama = "latest"
prek = "latest"
python = "3.14"
uv = "latest"

[tasks."test:tapio"]
dir = "tapio"
run = "uv run pytest --cov=tapio --cov-fail-under=80"

[tasks.tapio]
dir = "tapio"
run = "uv run tapio serve"

[tasks."test:crawl"]
dir = "crawler"
run = "uv run pytest --cov=tapio_crawler --cov-fail-under=80"

[tasks.crawl]
dir = "crawler"
run = """
for site in $(uv run tapio-crawler list-sites); do
  uv run tapio-crawler crawl "$site" || exit $?
done
"""

[tasks."test:ingest"]
dir = "ingest"
run = "uv run pytest --cov=tapio_ingest --cov-fail-under=80"

[tasks.ingest]
dir = "ingest"
run = "uv run tapio-ingest"
